<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="1240" height="680" role="img" aria-labelledby="cloud-title cloud-desc"><title id="cloud-title">Future Azure production architecture</title><desc id="cloud-desc">Analysts reach the Qent container app through Entra sign-in, a future front door and WAF; a scheduled job collects feeds into PostgreSQL, and Azure OpenAI in an EU data zone writes summaries.</desc><defs><marker id="cloud-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#8b9ab0" stroke-width="1.6"/></marker></defs><style>
.bg{fill:#0a101b}.mask{fill:#0a101b}
.box{fill:#101826;stroke:#2a3a52;stroke-width:1.2}
.box.focal{fill:#0f2a26;stroke:#3ee6a8;stroke-width:1.6}
.box.ext{fill:none;stroke:#8b9ab0;stroke-dasharray:5 4}
.box.fut{fill:none;stroke:#5aa9ff;stroke-dasharray:5 4}
.box.warn{fill:#2a1118;stroke:#ff6b78;stroke-dasharray:5 4}
.zone{fill:#ffffff06;stroke:#2a3a52;stroke-dasharray:2 4}
.nm{font:600 14px system-ui,'Segoe UI',sans-serif;fill:#eaf0f8}
.sb{font:10.5px ui-monospace,Consolas,monospace;fill:#8b9ab0}
.tg{font:600 10px ui-monospace,Consolas,monospace;letter-spacing:.12em;fill:#8b9ab0}
.lb{font:600 10px ui-monospace,Consolas,monospace;letter-spacing:.06em;fill:#eaf0f8}
.ar{fill:none;stroke:#8b9ab0;stroke-width:1.5}.ar.acc{stroke:#3ee6a8;stroke-width:1.8}.ar.opt{stroke-dasharray:5 4}
.nt{font:italic 13px Georgia,serif;fill:#8b9ab0}
</style><rect class="bg" width="1240" height="680"/><rect class="zone" x="380" y="30" width="640" height="640" rx="10"/><text class="tg" x="394" y="50">AZURE · EU REGION (swedencentral)</text><path class="ar " d="M150 335 L200 335" marker-end="url(#cloud-a)"/><path class="ar acc" d="M350 335 L420 335" marker-end="url(#cloud-a)"/><path class="ar opt" d="M350 125 L462.0 125.0 Q470 125 470.0 133.0 L470 300" marker-end="url(#cloud-a)"/><path class="ar " d="M540 300 L540.0 103.0 Q540 95 548.0 95.0 L760 95" marker-end="url(#cloud-a)"/><path class="ar opt" d="M760 225 L618.0 225.0 Q610 225 610.0 233.0 L610 300" marker-end="url(#cloud-a)"/><path class="ar acc" d="M660 335 L692.0 335.0 Q700 335 700.0 343.0 L700.0 412.0 Q700 420 708.0 420.0 L760 420" marker-end="url(#cloud-a)"/><path class="ar " d="M660 473 L847.0 473.0 Q855 473 855.0 465.0 L855 455" marker-end="url(#cloud-a)"/><path class="ar " d="M660 497 L1060 497" marker-end="url(#cloud-a)"/><path class="ar opt" d="M540 570 L540 520" marker-end="url(#cloud-a)"/><rect class="mask" x="20" y="300" width="130" height="70" rx="6"/><rect class="box ext" x="20" y="300" width="130" height="70" rx="6"/><text class="nm" x="30" y="326">Analyst</text><text class="sb" x="30" y="344">browser</text><rect class="mask" x="200" y="300" width="150" height="70" rx="6"/><rect class="box fut" x="200" y="300" width="150" height="70" rx="6"/><text class="nm" x="210" y="326">Front Door + WAF</text><text class="sb" x="210" y="344">future · TLS · rules</text><rect class="mask" x="200" y="90" width="150" height="70" rx="6"/><rect class="box ext" x="200" y="90" width="150" height="70" rx="6"/><text class="nm" x="210" y="116">Entra ID</text><text class="sb" x="210" y="134">sign-in · roles</text><rect class="mask" x="420" y="300" width="240" height="70" rx="6"/><rect class="box focal" x="420" y="300" width="240" height="70" rx="6"/><text class="nm" x="430" y="326">Qent web app</text><text class="sb" x="430" y="344">Container App · 1 replica</text><text class="sb" x="430" y="358">Viewer / Analyst / Admin</text><rect class="mask" x="420" y="450" width="240" height="70" rx="6"/><rect class="box " x="420" y="450" width="240" height="70" rx="6"/><text class="nm" x="430" y="476">Qent collect job</text><text class="sb" x="430" y="494">Container Apps Job</text><text class="sb" x="430" y="508">cron, python qent.py collect</text><rect class="mask" x="420" y="570" width="240" height="66" rx="6"/><rect class="box " x="420" y="570" width="240" height="66" rx="6"/><text class="nm" x="430" y="596">Container Registry</text><text class="sb" x="430" y="614">one image, both apps</text><rect class="mask" x="760" y="385" width="190" height="70" rx="6"/><rect class="box " x="760" y="385" width="190" height="70" rx="6"/><text class="nm" x="770" y="411">PostgreSQL</text><text class="sb" x="770" y="429">Flexible Server · B1ms</text><text class="sb" x="770" y="443">backups 7 days</text><rect class="mask" x="760" y="190" width="190" height="70" rx="6"/><rect class="box " x="760" y="190" width="190" height="70" rx="6"/><text class="nm" x="770" y="216">Key Vault</text><text class="sb" x="770" y="234">secrets · keys</text><rect class="mask" x="760" y="60" width="190" height="70" rx="6"/><rect class="box " x="760" y="60" width="190" height="70" rx="6"/><text class="nm" x="770" y="86">Azure OpenAI</text><text class="sb" x="770" y="104">EU data zone</text><text class="sb" x="770" y="118">public items only</text><rect class="mask" x="1060" y="455" width="150" height="70" rx="6"/><rect class="box ext" x="1060" y="455" width="150" height="70" rx="6"/><text class="nm" x="1070" y="481">Feeds + MISP</text><text class="sb" x="1070" y="499">public feeds</text><text class="sb" x="1070" y="513">your MISP</text><rect class="mask" x="20" y="450" width="330" height="190" rx="6"/><rect class="box " x="20" y="450" width="330" height="190" rx="6"/><text class="nm" x="30" y="476">Today vs next</text><text class="sb" x="30" y="494">Today: deploy.ps1 (written,</text><text class="sb" x="30" y="508">never run) builds the boxes with</text><text class="sb" x="30" y="522">solid lines: web app, job,</text><text class="sb" x="30" y="536">PostgreSQL, Key Vault, OpenAI.</text><text class="sb" x="30" y="550"></text><text class="sb" x="30" y="564">Next (dashed): Front Door + WAF,</text><text class="sb" x="30" y="578">private endpoints, managed</text><text class="sb" x="30" y="592">identity, multi-replica, Bicep.</text><rect class="mask" x="362.0" y="307" width="46.0" height="16" rx="2"/><text class="lb" x="385" y="319" text-anchor="middle">HTTPS</text><rect class="mask" x="480" y="207" width="73.2" height="16" rx="2"/><text class="lb" x="486" y="219">EASY AUTH</text><rect class="mask" x="620.2" y="67" width="59.6" height="16" rx="2"/><text class="lb" x="650" y="79" text-anchor="middle">SUMMARY</text><rect class="mask" x="655.2" y="197" width="59.6" height="16" rx="2"/><text class="lb" x="685" y="209" text-anchor="middle">SECRETS</text><rect class="mask" x="713.8" y="392" width="32.4" height="16" rx="2"/><text class="lb" x="730" y="404" text-anchor="middle">SQL</text><rect class="mask" x="677.0" y="445" width="46.0" height="16" rx="2"/><text class="lb" x="700" y="457" text-anchor="middle">ITEMS</text><rect class="mask" x="916.6" y="469" width="86.8" height="16" rx="2"/><text class="lb" x="960" y="481" text-anchor="middle">FETCH HTTPS</text><rect class="mask" x="550" y="537" width="46.0" height="16" rx="2"/><text class="lb" x="556" y="549">IMAGE</text></svg>