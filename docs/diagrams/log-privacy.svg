<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 520" width="1240" height="520" role="img" aria-labelledby="priv-title priv-desc"><title id="priv-title">Internal log privacy pipeline</title><desc id="priv-desc">Uploaded logs are parsed in memory, stripped of usernames and unknown columns, pseudonymised, stored for 30 days, analysed by rule-based detectors, and leave Qent only through the share gate.</desc><defs><marker id="priv-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#8b9ab0" stroke-width="1.6"/></marker></defs><style>
.bg{fill:#0a101b}.mask{fill:#0a101b}
.box{fill:#101826;stroke:#2a3a52;stroke-width:1.2}
.box.focal{fill:#0f2a26;stroke:#3ee6a8;stroke-width:1.6}
.box.ext{fill:none;stroke:#8b9ab0;stroke-dasharray:5 4}
.box.fut{fill:none;stroke:#5aa9ff;stroke-dasharray:5 4}
.box.warn{fill:#2a1118;stroke:#ff6b78;stroke-dasharray:5 4}
.zone{fill:#ffffff06;stroke:#2a3a52;stroke-dasharray:2 4}
.nm{font:600 14px system-ui,'Segoe UI',sans-serif;fill:#eaf0f8}
.sb{font:10.5px ui-monospace,Consolas,monospace;fill:#8b9ab0}
.tg{font:600 10px ui-monospace,Consolas,monospace;letter-spacing:.12em;fill:#8b9ab0}
.lb{font:600 10px ui-monospace,Consolas,monospace;letter-spacing:.06em;fill:#eaf0f8}
.ar{fill:none;stroke:#8b9ab0;stroke-width:1.5}.ar.acc{stroke:#3ee6a8;stroke-width:1.8}.ar.opt{stroke-dasharray:5 4}
.nt{font:italic 13px Georgia,serif;fill:#8b9ab0}
</style><rect class="bg" width="1240" height="520"/><rect class="zone" x="690" y="80" width="530" height="150" rx="10"/><text class="tg" x="704" y="100">STORED: PSEUDONYMISED, DELETED AFTER 30 DAYS</text><rect class="zone" x="10" y="80" width="660" height="150" rx="10"/><text class="tg" x="24" y="100">IN MEMORY WHILE PARSING</text><path class="ar " d="M170 158 L270 158" marker-end="url(#priv-a)"/><path class="ar " d="M410 158 L510 158" marker-end="url(#priv-a)"/><path class="ar acc" d="M650 158 L750 158" marker-end="url(#priv-a)"/><path class="ar " d="M890 158 L990 158" marker-end="url(#priv-a)"/><path class="ar acc" d="M1060 196 L1060.0 254.0 Q1060 262 1052.0 262.0 L348.0 262.0 Q340 262 340.0 270.0 L340 330" marker-end="url(#priv-a)"/><path class="ar opt" d="M170 368 L270 368" marker-end="url(#priv-a)" marker-start="url(#priv-a)"/><path class="ar " d="M410 368 L510 368" marker-end="url(#priv-a)"/><path class="ar acc" d="M650 368 L750 368" marker-end="url(#priv-a)"/><rect class="mask" x="30" y="120" width="140" height="76" rx="6"/><rect class="box ext" x="30" y="120" width="140" height="76" rx="6"/><text class="nm" x="40" y="146">CSV upload</text><text class="sb" x="40" y="164">20 MB · 200k rows</text><text class="sb" x="40" y="178">parsed in memory</text><rect class="mask" x="270" y="120" width="140" height="76" rx="6"/><rect class="box " x="270" y="120" width="140" height="76" rx="6"/><text class="nm" x="280" y="146">Column filter</text><text class="sb" x="280" y="164">drop usernames</text><text class="sb" x="280" y="178">drop unknown cols</text><rect class="mask" x="510" y="120" width="140" height="76" rx="6"/><rect class="box focal" x="510" y="120" width="140" height="76" rx="6"/><text class="nm" x="520" y="146">Pseudonymise</text><text class="sb" x="520" y="164">keyed asset IDs</text><text class="sb" x="520" y="178">redact cmds, paths</text><rect class="mask" x="750" y="120" width="140" height="76" rx="6"/><rect class="box " x="750" y="120" width="140" height="76" rx="6"/><text class="nm" x="760" y="146">Local store</text><text class="sb" x="760" y="164">SQLite / PostgreSQL</text><text class="sb" x="760" y="178">30-day retention</text><rect class="mask" x="990" y="120" width="140" height="76" rx="6"/><rect class="box " x="990" y="120" width="140" height="76" rx="6"/><text class="nm" x="1000" y="146">Detectors</text><text class="sb" x="1000" y="164">rule-based, ATT&amp;CK</text><text class="sb" x="1000" y="178">no model involved</text><text class="tg" x="30" y="312" text-anchor="start">LEAVES QENT ONLY THROUGH THE GATE</text><rect class="mask" x="30" y="330" width="140" height="76" rx="6"/><rect class="box ext" x="30" y="330" width="140" height="76" rx="6"/><text class="nm" x="40" y="356">Your MISP</text><text class="sb" x="40" y="374">read: lookup</text><text class="sb" x="40" y="388">write: off by default</text><rect class="mask" x="270" y="330" width="140" height="76" rx="6"/><rect class="box " x="270" y="330" width="140" height="76" rx="6"/><text class="nm" x="280" y="356">Sightings</text><text class="sb" x="280" y="374">vs feeds + MISP</text><text class="sb" x="280" y="388">first seen · assets</text><rect class="mask" x="510" y="330" width="140" height="76" rx="6"/><rect class="box focal" x="510" y="330" width="140" height="76" rx="6"/><text class="nm" x="520" y="356">share_safe()</text><text class="sb" x="520" y="374">no pseudonyms</text><text class="sb" x="520" y="388">no private IPs</text><rect class="mask" x="750" y="330" width="230" height="76" rx="6"/><rect class="box " x="750" y="330" width="230" height="76" rx="6"/><text class="nm" x="760" y="356">Exports</text><text class="sb" x="760" y="374">STIX 2.1 · CSV · PDF</text><text class="sb" x="760" y="388">TAXII 2.1 · MISP push</text><rect class="mask" x="1010" y="330" width="200" height="76" rx="6"/><rect class="box warn" x="1010" y="330" width="200" height="76" rx="6"/><text class="nm" x="1020" y="356">AI models</text><text class="sb" x="1020" y="374">never receive logs</text><text class="sb" x="1020" y="388">public feed items only</text><text class="nt" x="30" y="470" text-anchor="start">Usernames and unrecognised columns never reach the database. Push to MISP needs MISP_PUSH=1; TAXII needs TAXII=1.</text><rect class="mask" x="200.4" y="130" width="39.2" height="16" rx="2"/><text class="lb" x="220.0" y="142" text-anchor="middle">ROWS</text><rect class="mask" x="423.4" y="130" width="73.2" height="16" rx="2"/><text class="lb" x="460.0" y="142" text-anchor="middle">KEPT COLS</text><rect class="mask" x="663.4" y="130" width="73.2" height="16" rx="2"/><text class="lb" x="700.0" y="142" text-anchor="middle">SAFE ROWS</text><rect class="mask" x="920.4" y="130" width="39.2" height="16" rx="2"/><text class="lb" x="940.0" y="142" text-anchor="middle">ROWS</text><rect class="mask" x="666.8" y="234" width="66.4" height="16" rx="2"/><text class="lb" x="700" y="246" text-anchor="middle">FINDINGS</text><rect class="mask" x="193.6" y="340" width="52.8" height="16" rx="2"/><text class="lb" x="220" y="352" text-anchor="middle">LOOKUP</text><rect class="mask" x="423.4" y="340" width="73.2" height="16" rx="2"/><text class="lb" x="460" y="352" text-anchor="middle">SIGHTINGS</text><rect class="mask" x="666.8" y="340" width="66.4" height="16" rx="2"/><text class="lb" x="700" y="352" text-anchor="middle">SCRUBBED</text></svg>