<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 650" width="1240" height="650" role="img" aria-labelledby="flow-title flow-desc"><title id="flow-title">From feed item to PIR status</title><desc id="flow-desc">A feed item is kept only if its source is tasked to the PIR, it is newer than 30 days and a keyword hits; the PIR status then follows from analyst verdicts and independent source count.</desc><defs><marker id="flow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#8b9ab0" stroke-width="1.6"/></marker></defs><style>
.bg{fill:#0a101b}.mask{fill:#0a101b}
.box{fill:#101826;stroke:#2a3a52;stroke-width:1.2}
.box.focal{fill:#0f2a26;stroke:#3ee6a8;stroke-width:1.6}
.box.ext{fill:none;stroke:#8b9ab0;stroke-dasharray:5 4}
.box.fut{fill:none;stroke:#5aa9ff;stroke-dasharray:5 4}
.box.warn{fill:#2a1118;stroke:#ff6b78;stroke-dasharray:5 4}
.zone{fill:#ffffff06;stroke:#2a3a52;stroke-dasharray:2 4}
.nm{font:600 14px system-ui,'Segoe UI',sans-serif;fill:#eaf0f8}
.sb{font:10.5px ui-monospace,Consolas,monospace;fill:#8b9ab0}
.tg{font:600 10px ui-monospace,Consolas,monospace;letter-spacing:.12em;fill:#8b9ab0}
.lb{font:600 10px ui-monospace,Consolas,monospace;letter-spacing:.06em;fill:#eaf0f8}
.ar{fill:none;stroke:#8b9ab0;stroke-width:1.5}.ar.acc{stroke:#3ee6a8;stroke-width:1.8}.ar.opt{stroke-dasharray:5 4}
.nt{font:italic 13px Georgia,serif;fill:#8b9ab0}
</style><rect class="bg" width="1240" height="650"/><path class="ar acc" d="M180 86 L180 130" marker-end="url(#flow-a)"/><path class="ar acc" d="M180 202 L180 250" marker-end="url(#flow-a)"/><path class="ar acc" d="M180 322 L180 370" marker-end="url(#flow-a)"/><path class="ar acc" d="M180 442 L180 490" marker-end="url(#flow-a)"/><path class="ar opt" d="M320 166 L400 166" marker-end="url(#flow-a)"/><path class="ar opt" d="M320 286 L400 286" marker-end="url(#flow-a)"/><path class="ar opt" d="M320 406 L400 406" marker-end="url(#flow-a)"/><path class="ar acc" d="M320 528 L492.0 528.0 Q500 528 500.0 520.0 L500.0 174.0 Q500 166 508.0 166.0 L580 166" marker-end="url(#flow-a)"/><path class="ar " d="M730 202 L730 250" marker-end="url(#flow-a)"/><path class="ar " d="M730 322 L730 370" marker-end="url(#flow-a)"/><path class="ar " d="M730 442 L730 490" marker-end="url(#flow-a)"/><path class="ar acc" d="M880 166 L960 166" marker-end="url(#flow-a)"/><path class="ar acc" d="M880 286 L960 286" marker-end="url(#flow-a)"/><path class="ar acc" d="M880 406 L960 406" marker-end="url(#flow-a)"/><rect class="mask" x="40" y="30" width="280" height="56" rx="6"/><rect class="box ext" x="40" y="30" width="280" height="56" rx="6"/><text class="nm" x="50" y="56">Feed item</text><text class="sb" x="50" y="74">title + summary + date</text><rect class="mask" x="40" y="130" width="280" height="72" rx="6"/><rect class="box " x="40" y="130" width="280" height="72" rx="6"/><text class="tg" x="50" y="145">DECIDE</text><text class="nm" x="50" y="160">Source tasked to this PIR?</text><text class="sb" x="50" y="178">Sources tab: tasked PIRs</text><rect class="mask" x="40" y="250" width="280" height="72" rx="6"/><rect class="box " x="40" y="250" width="280" height="72" rx="6"/><text class="tg" x="50" y="265">DECIDE</text><text class="nm" x="50" y="280">Newer than 30 days?</text><text class="sb" x="50" y="298">MAX_AGE_DAYS = 30</text><rect class="mask" x="40" y="370" width="280" height="72" rx="6"/><rect class="box " x="40" y="370" width="280" height="72" rx="6"/><text class="tg" x="50" y="385">DECIDE</text><text class="nm" x="50" y="400">Keyword hits at a word start?</text><text class="sb" x="50" y="418">&#x27;entra&#x27; does not hit &#x27;central&#x27;</text><rect class="mask" x="40" y="490" width="280" height="76" rx="6"/><rect class="box focal" x="40" y="490" width="280" height="76" rx="6"/><text class="nm" x="50" y="516">Keep + score</text><text class="sb" x="50" y="534">hits (max 3) + context</text><text class="sb" x="50" y="548">+ reliability + verdict</text><text class="sb" x="408" y="170" text-anchor="start">NO: dropped</text><text class="sb" x="408" y="290" text-anchor="start">NO: dropped</text><text class="sb" x="408" y="410" text-anchor="start">NO: dropped</text><rect class="mask" x="580" y="130" width="300" height="72" rx="6"/><rect class="box " x="580" y="130" width="300" height="72" rx="6"/><text class="tg" x="590" y="145">DECIDE</text><text class="nm" x="590" y="160">Analyst marked &#x27;answers&#x27;?</text><text class="sb" x="590" y="178">Requirements tab verdict</text><rect class="mask" x="580" y="250" width="300" height="72" rx="6"/><rect class="box " x="580" y="250" width="300" height="72" rx="6"/><text class="tg" x="590" y="265">DECIDE</text><text class="nm" x="590" y="280">2+ sources and strong item?</text><text class="sb" x="590" y="298">independent, score &gt;= 4</text><rect class="mask" x="580" y="370" width="300" height="72" rx="6"/><rect class="box " x="580" y="370" width="300" height="72" rx="6"/><text class="tg" x="590" y="385">DECIDE</text><text class="nm" x="590" y="400">Any matching item?</text><text class="sb" x="590" y="418">or a &#x27;partial&#x27; verdict</text><rect class="mask" x="580" y="490" width="300" height="64" rx="6"/><rect class="box ext" x="580" y="490" width="300" height="64" rx="6"/><text class="nm" x="590" y="516">OPEN</text><text class="sb" x="590" y="534">no evidence yet: a gap</text><rect class="mask" x="960" y="130" width="240" height="72" rx="6"/><rect class="box focal" x="960" y="130" width="240" height="72" rx="6"/><text class="nm" x="970" y="156">ANSWERED</text><text class="sb" x="970" y="174">an analyst confirmed it</text><rect class="mask" x="960" y="250" width="240" height="72" rx="6"/><rect class="box " x="960" y="250" width="240" height="72" rx="6"/><text class="nm" x="970" y="276">SUPPORTED</text><text class="sb" x="970" y="294">2+ sources, strong item</text><rect class="mask" x="960" y="370" width="240" height="72" rx="6"/><rect class="box " x="960" y="370" width="240" height="72" rx="6"/><text class="nm" x="970" y="396">PARTIAL</text><text class="sb" x="970" y="414">some, uncorroborated</text><rect class="mask" x="960" y="490" width="240" height="140" rx="6"/><rect class="box " x="960" y="490" width="240" height="140" rx="6"/><text class="nm" x="970" y="516">Shown, never hidden</text><text class="sb" x="970" y="534">GAP: no items / no source</text><text class="sb" x="970" y="548">source failed</text><text class="sb" x="970" y="562">STALE: older than limit</text><text class="sb" x="970" y="576">Confidence: 1 src low,</text><text class="sb" x="970" y="590">2 medium, 3+ high</text><rect class="mask" x="190" y="218" width="32.4" height="16" rx="2"/><text class="lb" x="196" y="230">YES</text><rect class="mask" x="190" y="338" width="32.4" height="16" rx="2"/><text class="lb" x="196" y="350">YES</text><rect class="mask" x="190" y="458" width="32.4" height="16" rx="2"/><text class="lb" x="196" y="470">YES</text><rect class="mask" x="370.0" y="500" width="80.0" height="16" rx="2"/><text class="lb" x="410" y="512" text-anchor="middle">KEPT ITEMS</text><rect class="mask" x="740" y="218" width="25.6" height="16" rx="2"/><text class="lb" x="746" y="230">NO</text><rect class="mask" x="740" y="338" width="25.6" height="16" rx="2"/><text class="lb" x="746" y="350">NO</text><rect class="mask" x="740" y="458" width="25.6" height="16" rx="2"/><text class="lb" x="746" y="470">NO</text><rect class="mask" x="903.8" y="138" width="32.4" height="16" rx="2"/><text class="lb" x="920" y="150" text-anchor="middle">YES</text><rect class="mask" x="903.8" y="258" width="32.4" height="16" rx="2"/><text class="lb" x="920" y="270" text-anchor="middle">YES</text><rect class="mask" x="903.8" y="378" width="32.4" height="16" rx="2"/><text class="lb" x="920" y="390" text-anchor="middle">YES</text></svg>