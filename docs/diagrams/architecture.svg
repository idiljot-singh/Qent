<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" width="1240" height="640" role="img" aria-labelledby="arch-title arch-desc"><title id="arch-title">Qent system architecture</title><desc id="arch-desc">Public feeds and PIRs flow through collector, matcher, extractor and assessor to the dashboard, while your logs flow through a privacy filter, detectors and sightings to a share gate.</desc><defs><marker id="arch-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#8b9ab0" stroke-width="1.6"/></marker></defs><style>
.bg{fill:#0a101b}.mask{fill:#0a101b}
.box{fill:#101826;stroke:#2a3a52;stroke-width:1.2}
.box.focal{fill:#0f2a26;stroke:#3ee6a8;stroke-width:1.6}
.box.ext{fill:none;stroke:#8b9ab0;stroke-dasharray:5 4}
.box.fut{fill:none;stroke:#5aa9ff;stroke-dasharray:5 4}
.box.warn{fill:#2a1118;stroke:#ff6b78;stroke-dasharray:5 4}
.zone{fill:#ffffff06;stroke:#2a3a52;stroke-dasharray:2 4}
.nm{font:600 14px system-ui,'Segoe UI',sans-serif;fill:#eaf0f8}
.sb{font:10.5px ui-monospace,Consolas,monospace;fill:#8b9ab0}
.tg{font:600 10px ui-monospace,Consolas,monospace;letter-spacing:.12em;fill:#8b9ab0}
.lb{font:600 10px ui-monospace,Consolas,monospace;letter-spacing:.06em;fill:#eaf0f8}
.ar{fill:none;stroke:#8b9ab0;stroke-width:1.5}.ar.acc{stroke:#3ee6a8;stroke-width:1.8}.ar.opt{stroke-dasharray:5 4}
.nt{font:italic 13px Georgia,serif;fill:#8b9ab0}
</style><rect class="bg" width="1240" height="640"/><path class="ar " d="M180 188 L287 188" marker-end="url(#arch-a)"/><path class="ar " d="M437 188 L544 188" marker-end="url(#arch-a)"/><path class="ar acc" d="M694 188 L801 188" marker-end="url(#arch-a)"/><path class="ar acc" d="M951 188 L1058 188" marker-end="url(#arch-a)"/><path class="ar " d="M619 94 L619 150" marker-end="url(#arch-a)"/><path class="ar opt" d="M1133 150 L1133 94" marker-end="url(#arch-a)" marker-start="url(#arch-a)"/><path class="ar acc" d="M1133 226 L1133.0 312.0 Q1133 320 1125.0 320.0 L1064 320" marker-end="url(#arch-a)"/><path class="ar " d="M180 478 L287 478" marker-end="url(#arch-a)"/><path class="ar acc" d="M437 478 L544 478" marker-end="url(#arch-a)"/><path class="ar " d="M694 478 L801 478" marker-end="url(#arch-a)"/><path class="ar " d="M951 478 L1058 478" marker-end="url(#arch-a)"/><path class="ar " d="M619 440 L619 350" marker-end="url(#arch-a)"/><path class="ar opt" d="M876 516 L876 560" marker-end="url(#arch-a)" marker-start="url(#arch-a)"/><text class="tg" x="30" y="128" text-anchor="start">EXTERNAL INTELLIGENCE</text><text class="tg" x="30" y="418" text-anchor="start">YOUR OWN LOGS</text><rect class="mask" x="30" y="150" width="150" height="76" rx="6"/><rect class="box ext" x="30" y="150" width="150" height="76" rx="6"/><text class="nm" x="40" y="176">Public feeds</text><text class="sb" x="40" y="194">RSS · CISA KEV</text><text class="sb" x="40" y="208">Feodo · MISP events</text><rect class="mask" x="287" y="150" width="150" height="76" rx="6"/><rect class="box " x="287" y="150" width="150" height="76" rx="6"/><text class="nm" x="297" y="176">Collector</text><text class="sb" x="297" y="194">fetch · size caps</text><text class="sb" x="297" y="208">public hosts only</text><rect class="mask" x="544" y="150" width="150" height="76" rx="6"/><rect class="box " x="544" y="150" width="150" height="76" rx="6"/><text class="nm" x="554" y="176">Matcher</text><text class="sb" x="554" y="194">PIR keywords</text><text class="sb" x="554" y="208">newer than 30 days</text><rect class="mask" x="801" y="150" width="150" height="76" rx="6"/><rect class="box " x="801" y="150" width="150" height="76" rx="6"/><text class="nm" x="811" y="176">Extractor</text><text class="sb" x="811" y="194">malicious IoCs only</text><text class="sb" x="811" y="208">CVE · ATT&amp;CK · actors</text><rect class="mask" x="1058" y="150" width="150" height="76" rx="6"/><rect class="box focal" x="1058" y="150" width="150" height="76" rx="6"/><text class="nm" x="1068" y="176">Assessor</text><text class="sb" x="1068" y="194">score · confidence</text><text class="sb" x="1068" y="208">OPEN → ANSWERED</text><rect class="mask" x="544" y="30" width="150" height="64" rx="6"/><rect class="box " x="544" y="30" width="150" height="64" rx="6"/><text class="nm" x="554" y="56">PIRs</text><text class="sb" x="554" y="74">questions + keywords</text><rect class="mask" x="1058" y="30" width="150" height="64" rx="6"/><rect class="box fut" x="1058" y="30" width="150" height="64" rx="6"/><text class="nm" x="1068" y="56">AI summary</text><text class="sb" x="1068" y="74">public items only</text><rect class="mask" x="544" y="290" width="520" height="60" rx="6"/><rect class="box " x="544" y="290" width="520" height="60" rx="6"/><text class="nm" x="554" y="316">Dashboard</text><text class="sb" x="554" y="334">Intelligence · Internal · Overview · Requirements · Sources · Health</text><rect class="mask" x="30" y="440" width="150" height="76" rx="6"/><rect class="box ext" x="30" y="440" width="150" height="76" rx="6"/><text class="nm" x="40" y="466">Your logs</text><text class="sb" x="40" y="484">firewall · VPN · EDR</text><text class="sb" x="40" y="498">CSV upload</text><rect class="mask" x="287" y="440" width="150" height="76" rx="6"/><rect class="box focal" x="287" y="440" width="150" height="76" rx="6"/><text class="nm" x="297" y="466">Privacy filter</text><text class="sb" x="297" y="484">drop usernames</text><text class="sb" x="297" y="498">pseudonymise assets</text><rect class="mask" x="544" y="440" width="150" height="76" rx="6"/><rect class="box " x="544" y="440" width="150" height="76" rx="6"/><text class="nm" x="554" y="466">Detectors</text><text class="sb" x="554" y="484">scans · brute force</text><text class="sb" x="554" y="498">beaconing · exploits</text><rect class="mask" x="801" y="440" width="150" height="76" rx="6"/><rect class="box " x="801" y="440" width="150" height="76" rx="6"/><text class="nm" x="811" y="466">Sightings</text><text class="sb" x="811" y="484">vs feeds + MISP</text><text class="sb" x="811" y="498">(read only)</text><rect class="mask" x="1058" y="440" width="150" height="76" rx="6"/><rect class="box " x="1058" y="440" width="150" height="76" rx="6"/><text class="nm" x="1068" y="466">Share gate</text><text class="sb" x="1068" y="484">share_safe()</text><text class="sb" x="1068" y="498">STIX · CSV · TAXII</text><rect class="mask" x="801" y="560" width="150" height="64" rx="6"/><rect class="box ext" x="801" y="560" width="150" height="64" rx="6"/><text class="nm" x="811" y="586">Your MISP</text><text class="sb" x="811" y="604">lookup · push (opt.)</text><text class="nt" x="30" y="604" text-anchor="start">State: SQLite qent.db (PostgreSQL in cloud mode). Log rows are deleted after 30 days.</text><text class="nt" x="30" y="626" text-anchor="start">No AI model ever sees log data.</text><rect class="mask" x="193.5" y="160" width="80.0" height="16" rx="2"/><text class="lb" x="233.5" y="172" text-anchor="middle">RSS / JSON</text><rect class="mask" x="467.5" y="160" width="46.0" height="16" rx="2"/><text class="lb" x="490.5" y="172" text-anchor="middle">ITEMS</text><rect class="mask" x="707.5" y="160" width="80.0" height="16" rx="2"/><text class="lb" x="747.5" y="172" text-anchor="middle">KEPT ITEMS</text><rect class="mask" x="964.5" y="160" width="80.0" height="16" rx="2"/><text class="lb" x="1004.5" y="172" text-anchor="middle">INDICATORS</text><rect class="mask" x="629" y="114" width="66.4" height="16" rx="2"/><text class="lb" x="635" y="126">KEYWORDS</text><rect class="mask" x="1143" y="114" width="86.8" height="16" rx="2"/><text class="lb" x="1149" y="126">PUBLIC ONLY</text><rect class="mask" x="1143" y="254" width="52.8" height="16" rx="2"/><text class="lb" x="1149" y="266">STATUS</text><rect class="mask" x="213.9" y="450" width="39.2" height="16" rx="2"/><text class="lb" x="233.5" y="462" text-anchor="middle">ROWS</text><rect class="mask" x="453.9" y="450" width="73.2" height="16" rx="2"/><text class="lb" x="490.5" y="462" text-anchor="middle">ASSET IDs</text><rect class="mask" x="714.3" y="450" width="66.4" height="16" rx="2"/><text class="lb" x="747.5" y="462" text-anchor="middle">FINDINGS</text><rect class="mask" x="967.9" y="450" width="73.2" height="16" rx="2"/><text class="lb" x="1004.5" y="462" text-anchor="middle">SIGHTINGS</text><rect class="mask" x="629" y="387" width="66.4" height="16" rx="2"/><text class="lb" x="635" y="399">FINDINGS</text><rect class="mask" x="886" y="528" width="100.4" height="16" rx="2"/><text class="lb" x="892" y="540">LOOKUP / PUSH</text></svg>